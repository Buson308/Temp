<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAM 浓度判定器</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --pink: #f472b6;
    --line: rgba(255, 255, 255, 0.1);
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e8ecf5;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(34, 211, 238, 0.18), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(167, 139, 250, 0.20), transparent 60%),
      linear-gradient(160deg, #07060f 0%, #0a1020 55%, #06131a 100%);
    background-attachment: fixed;
  }

  .card {
    width: 100%;
    max-width: 620px;
    padding: 32px 26px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--line);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 27px;
    letter-spacing: 0.5px;
    text-align: center;
    background: linear-gradient(90deg, #67e8f9, #a78bfa, #f472b6);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }

  @keyframes shine { to { background-position: 200% center; } }

  .subtitle {
    margin: 0 0 24px;
    text-align: center;
    font-size: 13.5px;
    color: #93a2b8;
    letter-spacing: 0.5px;
  }

  .input-row { display: flex; gap: 10px; }

  input {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font-size: 15px;
    color: #e8ecf5;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }

  input::placeholder { color: #6b7a90; }

  input:focus {
    border-color: var(--cyan);
    background: rgba(34, 211, 238, 0.06);
    box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12);
  }

  button {
    padding: 0 22px;
    font-size: 15px;
    font-weight: 700;
    color: #04121a;
    white-space: nowrap;
    cursor: pointer;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #67e8f9, #a78bfa);
    transition: transform .15s, filter .15s, opacity .15s;
  }

  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .hint {
    min-height: 18px;
    margin-top: 9px;
    font-size: 12.5px;
    text-align: center;
    color: #fb7185;
  }

  /* ---------- 结果区 ---------- */
  .result {
    display: none;
    margin-top: 26px;
    padding-top: 24px;
    border-top: 1px dashed rgba(255, 255, 255, 0.12);
  }

  .result.show { display: block; animation: fadeUp .45s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .main {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 22px;
    align-items: center;
  }

  .ring-wrap { position: relative; width: 190px; height: 190px; }

  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 12; }
  .ring-fg {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 540.35;
    stroke-dashoffset: 540.35;
    transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1);
    filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.55));
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .percent {
    font-size: 44px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(90deg, #67e8f9, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .percent small { font-size: 20px; -webkit-text-fill-color: #67e8f9; color: #67e8f9; }
  .ring-label { margin-top: 6px; font-size: 12px; color: #93a2b8; letter-spacing: 2px; }

  /* ---------- 四维 ---------- */
  .dims { display: flex; flex-direction: column; gap: 14px; }

  .dim-head {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: #a9b6c9;
    margin-bottom: 6px;
  }

  .dim-head b { color: #e8ecf5; font-variant-numeric: tabular-nums; }

  .track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    transition: width .9s cubic-bezier(.2, .8, .2, 1);
  }

  .fill.c1 { background: linear-gradient(90deg, #22d3ee, #67e8f9); }
  .fill.c2 { background: linear-gradient(90deg, #a78bfa, #c4b5fd); }
  .fill.c3 { background: linear-gradient(90deg, #f472b6, #fda4af); }
  .fill.c4 { background: linear-gradient(90deg, #34d399, #6ee7b7); }

  /* ---------- 结论 ---------- */
  .verdict {
    margin-top: 24px;
    padding: 16px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
  }

  .verdict-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .verdict-desc { font-size: 13.5px; line-height: 1.65; color: #9fb0c6; }
  .verdict-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 7px; }

  .tag {
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #67e8f9;
    background: rgba(34, 211, 238, 0.10);
    border: 1px solid rgba(34, 211, 238, 0.28);
  }

  .actions { margin-top: 16px; display: flex; gap: 10px; }

  .ghost-btn {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #cfd9e8;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 13px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }

  .ghost-btn:hover { background: rgba(255, 255, 255, 0.11); color: #fff; }

  .footnote { margin-top: 14px; text-align: center; font-size: 11.5px; color: #5d6b80; }

  @media (max-width: 560px) {
    .main { grid-template-columns: 1fr; justify-items: center; }
    .ring-wrap { width: 168px; height: 168px; }
    .dims { width: 100%; }
    .input-row { flex-direction: column; }
    button { padding: 14px 18px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>LAM 浓度判定器</h1>
    <p class="subtitle">输入昵称 / 关键词 / 一句暗号，测一测你的 LAM 浓度</p>

    <div class="input-row">
      <input id="keyword" type="text" maxlength="40" placeholder="例如：LAM、拉姆、以及任何你想说的" autocomplete="off" />
      <button id="startBtn">开始判定</button>
    </div>
    <div class="hint" id="hint"></div>

    <section class="result" id="result">
      <div class="main">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22d3ee" />
                <stop offset="55%" stop-color="#a78bfa" />
                <stop offset="100%" stop-color="#f472b6" />
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="100" cy="100" r="86" />
            <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="86" />
          </svg>
          <div class="ring-center">
            <div class="percent"><span id="percentNum">0</span><small>%</small></div>
            <div class="ring-label">LAM 浓度</div>
          </div>
        </div>

        <div class="dims" id="dims">
          <div>
            <div class="dim-head"><span>认知度</span><b id="v0">0</b></div>
            <div class="track"><div class="fill c1" id="f0"></div></div>
          </div>
          <div>
            <div class="dim-head"><span>沉浸度</span><b id="v1">0</b></div>
            <div class="track"><div class="fill c2" id="f1"></div></div>
          </div>
          <div>
            <div class="dim-head"><span>表达欲</span><b id="v2">0</b></div>
            <div class="track"><div class="fill c3" id="f2"></div></div>
          </div>
          <div>
            <div class="dim-head"><span>纯度</span><b id="v3">0</b></div>
            <div class="track"><div class="fill c4" id="f3"></div></div>
          </div>
        </div>
      </div>

      <div class="verdict">
        <div class="verdict-title" id="verdictTitle"></div>
        <div class="verdict-desc" id="verdictDesc"></div>
        <div class="verdict-tags" id="verdictTags"></div>
      </div>

      <div class="actions">
        <button class="ghost-btn" id="copyBtn">复制判定结果</button>
        <button class="ghost-btn" id="againBtn">换一个再测</button>
      </div>

      <div class="footnote">结果由输入内容确定性计算得出，仅供娱乐。</div>
    </section>
  </main>

<script>
  const input       = document.getElementById('keyword');
  const startBtn    = document.getElementById('startBtn');
  const hint        = document.getElementById('hint');
  const result      = document.getElementById('result');
  const ringFg      = document.getElementById('ringFg');
  const percentNum  = document.getElementById('percentNum');
  const verdictTitle= document.getElementById('verdictTitle');
  const verdictDesc = document.getElementById('verdictDesc');
  const verdictTags = document.getElementById('verdictTags');
  const copyBtn     = document.getElementById('copyBtn');
  const againBtn    = document.getElementById('againBtn');
  const fills       = [0,1,2,3].map(i => document.getElementById('f' + i));
  const values      = [0,1,2,3].map(i => document.getElementById('v' + i));

  const CIRCUMFERENCE = 2 * Math.PI * 86; // ≈ 540.35
  ringFg.style.strokeDasharray = CIRCUMFERENCE;

  /* ============ 可自定义：关键词加成规则 ============ */
  const keywordRules = [
    { words: ['lam', '拉姆'],                 bonus: 14, tag: '直球命中 LAM' },
    { words: ['浓度', '纯度', '判定'],         bonus: 7,  tag: '判定体玩家' },
    { words: ['喜欢', '爱', '推', '本命'],      bonus: 6,  tag: '情感浓度偏高' },
    { words: ['每天', '一直', '永远', '睡不着'], bonus: 5,  tag: '高频关注者' }
  ];

  /* ============ 确定性哈希 ============ */
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

  /* ============ 核心计算 ============ */
  function analyze(text) {
    const h = hashString(text);

    // 四个维度：用哈希的不同位段派生，保证同输入同结果
    const dims = [
      30 + ((h >>> 3)  % 66),   // 认知度 30~95
      25 + ((h >>> 11) % 71),   // 沉浸度 25~95
      20 + ((h >>> 19) % 76),   // 表达欲 20~95
      28 + ((h >>> 27) % 68)    // 纯度   28~95
    ];

    // 关键词加成
    const lower = text.toLowerCase();
    const tags = [];
    let bonus = 0;

    keywordRules.forEach(rule => {
      if (rule.words.some(w => lower.includes(w.toLowerCase()))) {
        bonus += rule.bonus;
        tags.push(rule.tag);
      }
    });

    // 长度微调：输入越具体，判定越"笃定"
    const lengthBonus = Math.min(text.length, 12) * 0.6;

    // 加成按权重分配到各维度
    const weighted = [
      dims[0] + bonus * 0.30,
      dims[1] + bonus * 0.35,
      dims[2] + bonus * 0.20,
      dims[3] + bonus * 0.40
    ].map(v => clamp(Math.round(v), 0, 100));

    const total = clamp(
      Math.round((weighted[0] + weighted[1] + weighted[2] + weighted[3]) / 4 + lengthBonus),
      0, 100
    );

    return { dims: weighted, total, tags };
  }

  /* ============ 等级文案 ============ */
  function getVerdict(total) {
    if (total >= 95) return { title: 'LAM 本体',     desc: '检测值已超出量程。你不是在测 LAM，你就是 LAM 的信号源。' };
    if (total >= 80) return { title: '重度沉浸',     desc: '浓度极高，日常表达里大概率已经带着 LAM 的痕迹，藏不太住。' };
    if (total >= 60) return { title: '高浓度携带者', desc: '稳定偏高。属于那种被问到会先愣一下、然后开始长篇解释的类型。' };
    if (total >= 40) return { title: '常规浓度',     desc: '处在健康区间：有接触、有印象，但还没到影响判断的程度。' };
    if (total >= 20) return { title: '轻度沾边',     desc: '偶尔路过，知道存在，但主动关注的频率并不高。' };
    return             { title: 'LAM 绝缘体',       desc: '检测不到明显信号。你和 LAM 之间，大概还隔着一整个次元。' };
  }

  /* ============ 动画工具 ============ */
  let rafId = null;

  function animateNumber(el, target, duration = 900) {
    cancelAnimationFrame(rafId);
    const start = performance.now();
    const from = Number(el.textContent) || 0;

    function frame(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (target - from) * eased);
      if (p < 1) rafId = requestAnimationFrame(frame);
      else el.textContent = target;
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ============ 主流程 ============ */
  let lastReport = '';

  function runTest() {
    const text = input.value.trim();
    hint.textContent = '';

    if (!text) {
      hint.textContent = '请先输入一点内容，判定器需要一点信号';
      input.focus();
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = '判定中…';

    const { dims, total, tags } = analyze(text);
    const v = getVerdict(total);

    result.classList.add('show');

    // 重置
    ringFg.style.strokeDashoffset = CIRCUMFERENCE;
    percentNum.textContent = '0';
    fills.forEach(f => (f.style.width = '0%'));
    values.forEach(el => (el.textContent = '0'));
    verdictTags.innerHTML = '';

    setTimeout(() => {
      // 圆环
      ringFg.style.strokeDashoffset = CIRCUMFERENCE * (1 - total / 100);
      animateNumber(percentNum, total, 1100);

      // 四维
      dims.forEach((val, i) => {
        fills[i].style.width = val + '%';
        animateNumber(values[i], val, 900);
      });

      // 结论
      verdictTitle.textContent = `${v.title} · ${total}%`;
      verdictDesc.textContent = v.desc;

      if (tags.length) {
        tags.forEach(t => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = t;
          verdictTags.appendChild(span);
        });
      } else {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = '未命中特殊关键词';
        verdictTags.appendChild(span);
      }

      lastReport =
        `我的 LAM 浓度是 ${total}% —— ${v.title}\n` +
        `认知度 ${dims[0]}｜沉浸度 ${dims[1]}｜表达欲 ${dims[2]}｜纯度 ${dims[3]}`;

      startBtn.disabled = false;
      startBtn.textContent = '开始判定';
    }, 320);
  }

  startBtn.addEventListener('click', runTest);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') runTest();
  });

  againBtn.addEventListener('click', () => {
    input.value = '';
    hint.textContent = '';
    result.classList.remove('show');
    input.focus();
  });

  copyBtn.addEventListener('click', async () => {
    if (!lastReport) return;
    try {
      await navigator.clipboard.writeText(lastReport);
      copyBtn.textContent = '已复制 ✓';
    } catch {
      copyBtn.textContent = '复制失败，请手动选择';
    }
    setTimeout(() => (copyBtn.textContent = '复制判定结果'), 1600);
  });
</script>
</body>
</html>
